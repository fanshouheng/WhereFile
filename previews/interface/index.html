<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海屿 · 主界面预览</title><style>
:root{--ink:#233c49;--muted:#71818a;--line:#e4e9eb;--blue:#315e72;--paper:#f7f9fa}*{box-sizing:border-box}body{margin:0;background:#e9eef0;color:var(--ink);font:14px "Microsoft YaHei UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6aa7bf;outline-offset:3px}button{border:0;background:none}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}[hidden]{display:none!important}.app{max-width:1560px;margin:auto;min-height:100vh;background:var(--paper)}.titlebar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:#fff}.titlebar span:first-child{color:var(--ink)}.preview-badge{padding:4px 9px;border:1px solid var(--line);border-radius:5px}.shell{display:grid;grid-template-columns:175px minmax(0,1fr);min-height:calc(100vh - 48px)}aside{background:#fff;border-right:1px solid var(--line);padding:35px 16px 20px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;padding:0 14px 39px}.brand b{font:30px KaiTi,serif;letter-spacing:2px}.brand svg{width:28px;height:28px;color:var(--blue)}nav{display:grid;gap:7px}nav button{display:flex;align-items:center;gap:13px;text-align:left;padding:13px 16px;border-radius:8px;color:#78858b}nav button[aria-selected=true]{background:#edf3f6;color:var(--blue);font-weight:600}.rail-foot{margin-top:auto;padding:26px 14px 0;font-size:11px;color:#89959b;line-height:1.9}.main{padding:36px 34px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:26px;font-weight:600;margin:0 0 8px;letter-spacing:.5px}.top p{margin:0;color:var(--muted);font-size:13px}.quiet{font-size:12px;display:flex;gap:7px;align-items:center}.quiet i{width:6px;height:6px;border-radius:50%;background:#7f9f91}.workspace{display:grid;grid-template-columns:minmax(340px,.95fr) minmax(380px,1.2fr);gap:30px;align-items:start}.library{min-width:0}.filters{display:flex;gap:7px;margin-bottom:18px}.filters button{font-size:12px;padding:7px 13px;border-radius:20px;color:var(--muted)}.filters button[aria-pressed=true]{background:var(--ink);color:white}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.wall-card{text-align:left;padding:0}.wall-image{position:relative;display:block;border-radius:8px;overflow:hidden;border:3px solid transparent;outline:1px solid var(--line);background:#dbe7e9}.wall-card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;transition:transform .3s}.wall-card:hover img{transform:scale(1.035)}.wall-card[aria-pressed=true] .wall-image{border-color:var(--blue);outline-color:var(--blue)}.tick{display:none;position:absolute;right:7px;bottom:7px;background:var(--blue);color:white;width:23px;height:23px;border-radius:50%;text-align:center;line-height:23px;font-size:13px}.wall-card[aria-pressed=true] .tick{display:block}.wall-info{display:flex;justify-content:space-between;align-items:center;padding:10px 1px 0;font-size:12px}.wall-info small{font-size:10px;color:var(--muted)}.preview-column{position:sticky;top:24px}.preview-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:6px 0 18px}.preview-head span{color:var(--muted)}.scene{position:relative;overflow:hidden;aspect-ratio:16/10;border:6px solid #fff;border-radius:12px;box-shadow:0 10px 32px #233c4910;background:#adcacf}.scene-bg{width:100%;height:100%;object-fit:cover;display:block}.desktop-files{position:absolute;top:8%;left:4%;display:grid;gap:19px;text-align:center}.desktop-file{display:flex;align-items:center;flex-direction:column;gap:4px;color:white;font-size:9px;text-shadow:0 1px 3px #233c49}.folder{width:27px;height:21px;background:#ffd386;border-radius:3px;box-shadow:0 1px 4px #0002;position:relative}.folder:before{content:"";position:absolute;left:0;top:-4px;width:14px;height:6px;border-radius:3px;background:#ffe1a8}.doc{background:#fff;width:23px;height:28px;border-radius:2px;color:#789cae;font-size:18px;text-shadow:none}.boat{position:absolute;left:66%;top:46%;width:100px;height:112px;margin:-56px 0 0 -50px;animation:drift var(--travel-duration,12s) ease-in-out infinite;transform-origin:50% 75%}.boat.second{left:83%;top:72%;animation-delay:-6s;scale:.8}.boat-label{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:white;text-shadow:0 1px 3px #174354}.boat-art{width:100px;height:100px;display:block;filter:drop-shadow(0 5px 3px #17435435)}.boat-art svg{width:100%;height:100%;stroke:none}.taskbar{position:absolute;bottom:0;left:0;right:0;height:24px;background:#f6fbfd72;backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;gap:11px}.taskbar i{width:12px;height:12px;border-radius:3px;background:#fff9}.taskbar i:first-child{background:#37778f}.scene.paused .boat{animation-play-state:paused}.scene.no-labels .boat-label{display:none}.scene.no-files .desktop-files{display:none}@keyframes drift{0%,100%{translate:-8px 0;rotate:-1deg}50%{translate:10px -8px;rotate:1deg}}.preview-controls{display:flex;justify-content:space-between;align-items:center;padding:16px 3px;border-bottom:1px solid var(--line)}.play{display:flex;align-items:center;gap:8px;font-size:12px}.play svg{width:16px;height:16px}.fit{color:var(--muted);font-size:11px}.selection{display:flex;justify-content:space-between;padding:21px 2px;gap:10px}.selection small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.selection strong{font-weight:500;font-size:14px}.selection div:last-child{text-align:right}.apply{background:var(--blue);color:#fff;display:flex;width:100%;align-items:center;justify-content:center;gap:10px;border-radius:8px;height:43px;font-size:13px}.apply svg{width:17px;height:17px}.preview-note{text-align:center;color:var(--muted);font-size:11px;margin:12px 0}.section-title{font-size:13px;font-weight:600;margin:28px 0 12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:19px 0;border-bottom:1px solid var(--line);font-size:13px}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:7px;line-height:1.5}.switch{appearance:none;cursor:pointer;width:35px;height:20px;border-radius:15px;background:#cbd3d8;position:relative;flex-shrink:0;transition:background .2s}.switch:before{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:translate .2s}.switch:checked{background:var(--blue)}.switch:checked:before{translate:15px}.range-box{padding:22px 0}.range-label{display:flex;justify-content:space-between;margin-bottom:16px;font-size:13px}.range-label output{color:var(--muted);font-size:12px}input[type=range]{width:100%;accent-color:var(--blue)}.range-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}.setting select{border:1px solid var(--line);border-radius:5px;background:white;padding:6px;color:var(--ink);font-size:12px}.toast{position:fixed;bottom:28px;left:50%;translate:-50% 12px;background:var(--ink);color:white;padding:13px 22px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;font-size:12px}.toast.show{opacity:1;translate:-50% 0}.footline{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:#89959b;display:flex;justify-content:space-between}@media(min-width:1450px){.main{padding:44px}.workspace{gap:42px}.cards{gap:23px 18px}}@media(max-width:1050px){.shell{grid-template-columns:135px 1fr}.main{padding:26px 22px}.workspace{grid-template-columns:1fr}.preview-column{position:static;grid-row:1}.scene{aspect-ratio:16/8;max-height:360px}.preview-note{margin-bottom:24px}.selection{padding:15px 2px}.cards{grid-template-columns:repeat(3,1fr)}aside{padding:30px 8px}.brand{padding-left:12px}.quiet{display:none}}@media(max-width:600px){.titlebar{padding:0 16px}.shell{display:block}aside{padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand,.rail-foot{display:none}nav{display:flex;gap:8px}nav button{padding:10px 14px}.main{padding:24px 16px}.cards{grid-template-columns:1fr 1fr}.top{margin-bottom:22px}h1{font-size:23px}.scene{aspect-ratio:16/10}.boat{scale:.7}.boat.second{scale:.6}.footline{display:block;line-height:1.9}}
nav [data-tab=boats]{gap:9px;padding-left:12px;padding-right:12px;white-space:nowrap}
.scene.expansive{aspect-ratio:16/9;max-height:none;container-type:inline-size}
.scene.expansive .boat{left:52%;top:52%;animation:open-drift var(--travel-duration,48s) ease-in-out infinite;rotate:0deg}
.scene.expansive .boat.second{animation-delay:calc(var(--travel-duration,48s) * -.5)}
.scene[data-scene=space] .boat-art{filter:drop-shadow(0 0 8px #a2bffb45)}
.scene[data-scene=space] .boat-art img{animation:meteor-turn 18s ease-in-out infinite;transform-origin:50% 50%}
.scene[data-scene=desert] .boat-art{filter:drop-shadow(0 6px 3px #7d4e3038)}
.scene[data-scene=desert] .boat-art img{animation:dust-sway 3.6s ease-in-out infinite;transform-origin:50% 85%}
.scene.paused .boat,.scene[data-scene].paused .boat-art img{animation-play-state:paused}
@keyframes open-drift{0%,100%{translate:10cqw -4cqw}25%{translate:min(34cqw,calc(48cqw - 65px)) 8cqw}50%{translate:0cqw 12cqw}75%{translate:-28cqw -10cqw}}
@keyframes meteor-turn{0%,100%{rotate:-8deg}50%{rotate:12deg}}
@keyframes dust-sway{0%,100%{rotate:-2deg;scale:1 .97}50%{rotate:2deg;scale:1.025 1.035}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style></head><body><div class="app"><div class="titlebar"><span>海屿 · 让桌面慢下来</span><span class="preview-badge">界面预览</span></div><div class="shell"><aside><div class="brand"><svg viewBox="0 0 24 24"><path d="M12 3v14M10 5 4 15h6M14 6l6 9h-6M3 18q9 7 18 0ZM3 22q3-2 6 0t6 0t6 0"/></svg><b>海屿</b></div><nav role="tablist" aria-label="主导航"><button role="tab" aria-selected="true" data-tab="wallpapers"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 6-6 6 6 3-3 3 3"/><circle cx="16" cy="8" r="1"/></svg>壁纸</button><button role="tab" aria-selected="false" data-tab="boats"><svg viewBox="0 0 24 24"><path d="M12 3v14M10 5 4 15h6M14 6l6 9h-6M3 18q9 7 18 0Z"/></svg>场景物件</button><button role="tab" aria-selected="false" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg>设置</button></nav><div class="rail-foot">文件留在本机<br>风景留在桌面</div></aside><main class="main"><div class="top"><div><h1 id="page-title">挑一处喜欢的风景</h1><p id="page-subtitle">忙碌的时候，也能望一眼远方。</p></div><div class="quiet"><i></i>仅预览，不改变桌面</div></div><div class="workspace"><div class="library"><section id="wallpapers" role="tabpanel"><div class="filters" aria-label="壁纸分类"><button aria-pressed="true" data-filter="all">全部</button><button aria-pressed="false" data-filter="anime">二次元</button><button aria-pressed="false" data-filter="paint">手绘自然</button></div><div class="cards" id="wall-cards"></div></section><section id="boats" role="tabpanel" hidden><div style="display:flex;align-items:center;gap:20px;background:white;border:1px solid var(--line);border-radius:10px;padding:16px"><img id="scene-boat-image" width="120" height="120" style="object-fit:contain" alt=""><div><strong id="scene-boat-name" style="font-weight:500"></strong><p style="color:var(--muted);font-size:12px">随壁纸一起切换</p></div></div><h2 class="section-title">移动时的样子</h2><div class="range-box"><label class="range-label" for="boat-size">物件大小<output id="size-output">适中</output></label><input id="boat-size" type="range" min="70" max="130" value="100"><div class="range-ends"><span>小巧</span><span>醒目</span></div></div><label class="setting"><span>显示文件名<small>名称放在物件上方</small></span><input class="switch" id="show-labels" type="checkbox" checked></label><label class="setting"><span>动态效果</span><input class="switch" id="boat-motion" type="checkbox" checked></label></section><section id="settings" role="tabpanel" hidden><h2 class="section-title" style="margin-top:0">移动与声音</h2><div class="range-box"><label class="range-label" for="wind">移动速度<output id="wind-output">轻柔</output></label><input id="wind" type="range" min="0" max="100" value="35"><div class="range-ends"><span>静止</span><span>轻快</span></div></div><label class="setting" id="sound-setting"><span>海浪声<small>默认安静，需要时再打开</small></span><input class="switch" id="sound" type="checkbox"></label><h2 class="section-title">桌面与性能</h2><label class="setting"><span>显示桌面图标</span><input class="switch" id="show-files" type="checkbox" checked></label><label class="setting"><span>开机启动</span><input class="switch" id="startup" type="checkbox"></label><label class="setting"><span>全屏应用时暂停<small>玩游戏、看视频时减少占用</small></span><input class="switch" id="fullscreen-pause" type="checkbox" checked></label><label class="setting"><span>画面质量</span><select id="quality"><option>自动</option><option>流畅优先</option><option>画质优先</option></select></label></section></div><div class="preview-column"><div class="preview-head"><b>桌面预览</b><span>主显示器</span></div><div class="scene" id="scene"><img class="scene-bg" id="scene-bg" alt="樱花放学路"><div class="desktop-files"><div class="desktop-file"><i class="folder"></i>工作资料</div><div class="desktop-file"><i class="doc">≡</i>备忘录</div></div><div class="boat"><span class="boat-label">旅行清单.txt</span><span class="boat-art"></span></div><div class="boat second"><span class="boat-label">灵感便签.md</span><span class="boat-art"></span></div><div class="taskbar"><i></i><i></i><i></i><i></i></div></div><div class="preview-controls"><button class="play" id="play"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span>暂停预览</span></button><span class="fit">示意画面</span></div><div class="selection"><div><small>当前壁纸</small><strong id="wall-name">樱花放学路</strong></div><div><small>场景专属物件</small><strong id="boat-name">樱花划艇</strong></div></div><button class="apply" id="apply"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>试用这套搭配</button><p class="preview-note">只在此页面预览，不会替换系统壁纸</p></div></div><div class="footline"><span>文件变成风景里的物件，名称始终跟随。</span><span>海屿 · 主界面设计稿</span></div></main></div></div><div class="toast" role="status" id="toast"></div><script>
const $=id=>document.getElementById(id);
const scenes=[['sakura','樱花放学路','anime','../anime/sakura.png'],['moonlight','月色灯塔','anime','../anime/moonlight.png'],['oasis','夏日海岸线','anime','../anime/oasis.png'],['bamboo','藤花秘境','anime','../anime/bamboo.png'],['space','星环漫游','anime','../anime/space.webp'],['desert','风过沙海','anime','../anime/desert.webp'],['tropical','热带海湾','paint','../../assets/coast-hd.webp'],['snow','雪松湖岸','paint','../../assets/coast-snow.webp'],['autumn','秋日湖畔','paint','../../assets/coast-autumn.webp']];
const boatNames={sakura:'樱花划艇',moonlight:'月夜提灯舟',oasis:'夏日汽艇',bamboo:'藤花篷船',space:'星际陨石',desert:'小龙卷风',tropical:'海湾帆船',snow:'雪岸木舟',autumn:'秋日野餐船'};let chosenWall='sakura',playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;let toastTimer;
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function pickWall(id){const s=scenes.find(s=>s[0]===id);chosenWall=id;const expansive=id==='space'||id==='desert';$('scene').dataset.scene=id;$('scene').classList.toggle('expansive',expansive);$('sound-setting').hidden=expansive;$('scene-bg').src=s[3];$('scene-bg').alt=s[1];$('wall-name').textContent=s[1];document.querySelectorAll('.wall-card').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));pickBoat(id);motion()}
for(const [id,name,group,src]of scenes){const b=document.createElement('button');b.className='wall-card';b.dataset.id=id;b.dataset.group=group;b.setAttribute('aria-label',name);b.innerHTML=`<span class="wall-image"><img src="${src}" alt="" loading="lazy"><i class="tick">✓</i></span><span class="wall-info">${name}<small>${group==='anime'?'二次元':'手绘'}</small></span>`;b.onclick=()=>pickWall(id);$('wall-cards').append(b)}
function pickBoat(id){$('boat-name').textContent=boatNames[id];const size=+$('boat-size').value/100*(id==='space'||id==='desert'?1.15:1);document.querySelectorAll('.scene .boat-art').forEach(el=>{el.className='boat-art';el.style.scale=size;el.style.transformOrigin='50% 75%';el.innerHTML=`<img src="boats/${id}-cutout.png" alt="${boatNames[id]}" style="width:100%;height:100%;object-fit:contain">`});$('scene-boat-image').src=`boats/${id}-cutout.png`;$('scene-boat-image').alt=boatNames[id];$('scene-boat-name').textContent=boatNames[id]}
const titles={wallpapers:['挑一处喜欢的风景','忙碌的时候，也能望一眼远方。'],boats:['风景里的物件','每片风景，都有自己的陪伴。'],settings:['按你的节奏来','安静一点，或者走得慢一点。']};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',t===b));Object.keys(titles).forEach(id=>$(id).hidden=id!==b.dataset.tab);[$('page-title').textContent,$('page-subtitle').textContent]=titles[b.dataset.tab]});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(f=>f.setAttribute('aria-pressed',f===b));document.querySelectorAll('.wall-card').forEach(c=>c.hidden=b.dataset.filter!=='all'&&c.dataset.group!==b.dataset.filter)});
function motion(){const speed=+$('wind').value;const expansive=chosenWall==='space'||chosenWall==='desert';$('scene').style.setProperty('--travel-duration',(expansive?65-speed*.35:20-speed*.14)+'s');$('scene').classList.toggle('paused',!playing||!$('boat-motion').checked||speed===0);$('play').querySelector('span').textContent=playing?'暂停预览':'继续预览';$('play').setAttribute('aria-pressed',!playing)}
$('play').onclick=()=>{playing=!playing;motion()};$('boat-motion').onchange=motion;$('show-labels').onchange=e=>$('scene').classList.toggle('no-labels',!e.target.checked);$('show-files').onchange=e=>$('scene').classList.toggle('no-files',!e.target.checked);
$('boat-size').oninput=e=>{const n=+e.target.value;$('size-output').textContent=n<90?'小巧':n>110?'醒目':'适中';const size=n/100*(chosenWall==='space'||chosenWall==='desert'?1.15:1);document.querySelectorAll('.scene .boat-art').forEach(el=>{el.style.scale=size;el.style.transformOrigin='50% 75%'})};
$('wind').oninput=e=>{const n=+e.target.value;$('wind-output').textContent=n===0?'静止':n<65?'轻柔':'轻快';motion()};
$('sound').onchange=()=>toast('已更新声音选项，设计预览不播放音频');$('startup').onchange=()=>toast('已更新预览选项，不修改开机启动');$('fullscreen-pause').onchange=()=>toast('已更新全屏暂停选项');$('quality').onchange=()=>toast('已更新画面质量选项，仅用于预览');$('apply').onclick=()=>toast(`正在预览：${$('wall-name').textContent} · ${$('boat-name').textContent}`);pickWall(chosenWall);
</script></body></html>
