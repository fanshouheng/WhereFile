<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件漂走了 · WhereFile · 二次元风景</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#263c3e;font-family:"Microsoft YaHei UI",sans-serif}main{max-width:1440px;margin:auto;padding:48px 36px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px}h1{font:36px KaiTi,serif;margin:0}header p{font-size:13px;color:#687775}section{display:grid;grid-template-columns:1fr 1fr;gap:28px}.card{padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:zoom-in}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.card span{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 2px 4px}.card strong{font-size:20px;font-weight:500}.card small{font-size:12px;color:#687775}.card:focus-visible{outline:3px solid #387b7c;outline-offset:6px}dialog{padding:0;border:0;background:#142324;width:min(96vw,1600px);max-height:95vh;border-radius:8px}dialog::backdrop{background:#061113da}dialog img{display:block;width:100%;max-height:86vh;object-fit:contain}dialog footer{display:flex;justify-content:space-between;align-items:center;color:white;padding:14px 20px}dialog button{border:0;background:transparent;color:white;font:inherit;cursor:pointer}@media(max-width:700px){main{padding:28px 18px}header{display:block}section{grid-template-columns:1fr}.card span{display:block}.card small{display:block;margin-top:8px}}
</style><main><header><h1>去动画里住一天</h1><p>二次元概念预览 · 点击放大</p></header><section><button class="card" data-image="sakura.png" data-title="樱花放学路"><img src="sakura.png" alt="樱花放学路"><span><strong>樱花放学路</strong><small>粉樱 · 单车 · 薄荷绿河水</small></span></button><button class="card" data-image="moonlight.png" data-title="月色灯塔"><img src="moonlight.png" alt="月色灯塔"><span><strong>月色灯塔</strong><small>蓝紫夜色 · 灯塔 · 暖光小屋</small></span></button><button class="card" data-image="oasis.png" data-title="夏日海岸线"><img src="oasis.png" alt="夏日海岸线"><span><strong>夏日海岸线</strong><small>黄色电车 · 海边铁路 · 晴空蓝</small></span></button><button class="card" data-image="bamboo.png" data-title="藤花秘境"><img src="bamboo.png" alt="藤花秘境"><span><strong>藤花秘境</strong><small>垂落藤花 · 幻想小屋 · 青绿湖水</small></span></button></section></main><dialog><img alt=""><footer><span></span><button>关闭 ×</button></footer></dialog><script>
